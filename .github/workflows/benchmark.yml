name: Comparative Performance Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: comparative-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Java vs Python vs C++ vs Go vs Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: servers/go-nethttp/go.mod
          cache-dependency-path: servers/go-nethttp/go.mod

      - name: Install benchmark tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk
          wrk --version || true

      - name: Runtime versions
        run: |
          java -version
          python3 --version
          c++ --version | head -n1
          cmake --version | head -n1
          go version
          rustc --version
          cargo --version
          nproc
          lscpu

      - name: Build Java
        run: mvn -B -f servers/java-nio/pom.xml clean package

      - name: Validate Python
        run: python3 -m py_compile servers/python-asyncio/server.py

      - name: Build C++20 Release
        run: |
          cmake \
            -S servers/cpp20 \
            -B servers/cpp20/build-bench \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build servers/cpp20/build-bench --parallel

      - name: Build Go
        working-directory: servers/go-nethttp
        run: |
          mkdir -p bin
          go build -trimpath -o bin/go-nethttp .

      - name: Build Rust Release
        working-directory: servers/rust-hyper
        run: cargo build --release

      - name: Run category 1 - single-executor benchmark
        env:
          BENCH_DURATION: 10s
          BENCH_WARMUP_DURATION: 5s
          BENCH_THREADS: '2'
          BENCH_REPETITIONS: '3'
          BENCH_CONNECTIONS: '32 128'
          BENCH_WRK_TIMEOUT: 10s
          BENCH_RESULT_DIR: benchmark-results/single-executor
        run: bash scripts/ci-compare-benchmarks.sh

      - name: Run category 2 - multicore process-sharded benchmark
        env:
          BENCH_DURATION: 10s
          BENCH_WARMUP_DURATION: 5s
          BENCH_REPETITIONS: '3'
          BENCH_CONNECTIONS: '32 128'
          BENCH_WRK_TIMEOUT: 10s
          BENCH_MAX_SHARDS: '4'
          BENCH_RESULT_DIR: benchmark-results/multicore-process-sharded
        run: bash scripts/ci-compare-multicore.sh

      - name: Publish both comparisons in job summary
        if: always()
        run: |
          echo "# Comparative HTTP benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [[ -f benchmark-results/single-executor/comparison.md ]]; then
            cat benchmark-results/single-executor/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Single-executor report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [[ -f benchmark-results/multicore-process-sharded/comparison.md ]]; then
            cat benchmark-results/multicore-process-sharded/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Multicore/process-sharded report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports and raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparative-http-benchmark-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
